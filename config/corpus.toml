# Corpus do copiloto — 22 normativos do BCB sobre segurança cibernética,
# computação em nuvem, continuidade e risco operacional.
#
# Como esta lista foi montada (§4.1 do briefing — nada aqui veio de memória):
#   1. `endpoint_busca` foi consultado com dez consultas do tema;
#   2. sobrou o que a ementa confirma como do tema (Comunicados e Cartas Circulares
#      ficaram de fora: não têm corpo articulado, e a citação do projeto é por artigo);
#   3. cada norma foi baixada de `endpoint_normativo` e teve tipo, data, vigência e
#      número de artigos conferidos um a um;
#   4. Circular nº 3.647/2013 foi descartada — a fonte devolve um texto de 304
#      caracteres, sem artigo nenhum. Corpus pequeno e coeso vale mais que volume.
#
# `status_vigencia` aqui é o valor DECLARADO na curadoria. A coleta relê o campo na
# fonte e a divergência entre declarado e coletado é teste, não surpresa.

[fonte]
endpoint_normativo = "https://www.bcb.gov.br/api/conteudo/app/normativos/exibenormativo"
endpoint_busca = "https://www.bcb.gov.br/api/search/app/normativos/buscanormativos"
parametros = "p1 = tipo do normativo, p2 = número"
verificado_em = 2026-09-09

