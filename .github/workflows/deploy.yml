# Publica a imagem e aplica o Bicep no Azure (Fase 8).
#
# Não roda a cada push. Deploy de portfólio que dispara sozinho em toda edição de
# README gastaria 15 minutos de runner e uma volta inteira no site do BCB — a
# imagem reconstrói o corpus no build (ver `infra/Dockerfile`). Dispara por tag
# `v*`, que é uma decisão explícita, ou à mão.
#
# ---------------------------------------------------------------------------
# O QUE PRECISA EXISTIR ANTES (uma vez só) — o roteiro está em
# `.claude/skills/deploy-azure/SKILL.md`:
#
#   Variables:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#               AZURE_RESOURCE_GROUP, AZURE_LOCATION
#   Secrets:    GROQ_API_KEY  (e, opcionais, LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY)
#
# Não há senha de service principal em lugar nenhum: o `azure/login` usa OIDC
# (§10.5), e o token de federação vale por uma execução. `id-token: write` abaixo
# é o que o torna possível.
# ---------------------------------------------------------------------------
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      motivo:
        description: "Por que este deploy manual"
        required: false
        default: "manual"

concurrency:
  # Dois deploys simultâneos escreveriam no mesmo grupo de recursos. Aqui não se
  # cancela o que está em andamento: `az deployment group create` interrompido
  # deixa recurso meio criado.
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/copiloto-normativo

jobs:
  # Um deploy não pode ser o primeiro lugar onde se descobre que o lint quebrou.
  # É a mesma suíte hermética do `ci.yml`, e custa menos de um minuto.
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -m "not rede and not corpus"

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    # O build baixa 22 normas do BCB, gera os embeddings dos artigos em CPU e
    # puxa dois modelos ONNX. Não é um build de 3 minutos.
    timeout-minutes: 60
    outputs:
      imagem: ${{ steps.tag.outputs.imagem }}
    steps:
      - uses: actions/checkout@v4

      # O caminho de uma imagem no GHCR precisa ser minúsculo; login de usuário
      # no GitHub, não.
      - id: tag
        run: |
          repo=$(echo "${{ env.IMAGEM }}" | tr '[:upper:]' '[:lower:]')
          echo "imagem=${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pelo SHA e nunca `latest`: o Container Apps cria uma revisão nova
      # quando a imagem muda, e com tag móvel ele não tem como saber que mudou —
      # o rollback deixaria de existir junto.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.imagem }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  implantar:
    needs: publicar
    runs-on: ubuntu-latest
    # O Environment não é decoração. Ele faz duas coisas: dá ao token do OIDC um
    # `subject` estável (`repo:<dono>/<repo>:environment:azure`), o que permite
    # UMA credencial federada servindo tag e disparo manual em vez de uma por
    # tag; e é onde se liga aprovação manual, se o deploy tiver de ficar atrás de
    # gente — a mesma postura do HITL da Fase 5, aplicada à infraestrutura.
    environment: azure
    outputs:
      saude: ${{ steps.bicep.outputs.saude }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Garantir o grupo de recursos
        run: |
          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --output none

      # A imagem é pública no GHCR, então nenhuma credencial de registry entra
      # aqui. Se o pacote for privado, acrescentar `registroUsuario` e
      # `registroSenha` — o Bicep já tem os dois parâmetros.
      - id: bicep
        name: Aplicar o Bicep
        run: |
          saida=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              imagem="${{ needs.publicar.outputs.imagem }}" \
              groqApiKey="${{ secrets.GROQ_API_KEY }}" \
              langfusePublicKey="${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
              langfuseSecretKey="${{ secrets.LANGFUSE_SECRET_KEY }}" \
            --query properties.outputs.saude.value \
            --output tsv)
          echo "saude=${saida}" >> "$GITHUB_OUTPUT"
          echo "### Copiloto no ar: ${saida}" >> "$GITHUB_STEP_SUMMARY"

      # O critério de pronto da fase é "endpoint público respondendo /saude". Um
      # deploy que termina verde sem ninguém ter batido no endpoint não provou
      # isso. Com `minReplicas: 0` a primeira chamada acorda a réplica e carrega
      # dois modelos ONNX, então a espera é generosa de propósito.
      - name: Provar que respondeu
        run: |
          for tentativa in $(seq 1 30); do
            codigo=$(curl -s -o /tmp/saude.json -w '%{http_code}' --max-time 30 "${{ steps.bicep.outputs.saude }}" || true)
            if [ "$codigo" = "200" ]; then
              echo "cold start concluído na tentativa ${tentativa}"
              cat /tmp/saude.json
              exit 0
            fi
            echo "tentativa ${tentativa}: HTTP ${codigo}"
            sleep 10
          done
          echo "::error::/saude não respondeu 200 em 5 minutos"
          exit 1
