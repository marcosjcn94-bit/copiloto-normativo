# Lint, suíte hermética e camada 1 dos evals, em Linux (Fase 7).
#
# O que NÃO roda aqui, e por quê: os testes marcados `rede` e `corpus`, e as
# camadas 2 e 3 dos evals. `/data` e `/indices` estão no .gitignore, então o
# runner não tem catálogo nem índice; reconstruí-los exigiria bater no site do
# BCB e baixar 130 MB de modelo ONNX a cada push. A camada 2 (recall@5 e MRR) é
# medida na máquina e fica registrada em `evals/ablacao.md` e
# `evals/resultados.json`, com o commit anotado.
#
# A camada 1 roda inteira, sem corpus: contrato das tools, correspondência entre
# os nomes de tool do prompt e os do registro, e orçamento de contexto. As
# verificações que precisariam de corpus aparecem no relatório como puladas, com
# o motivo — `rodar.py` não devolve verde para o que não mediu.
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Formatação
        run: python -m ruff format --check .

      # `python -m` e não o console script: tests/test_assinatura.py importa
      # `tests.test_indexacao` e não há tests/__init__.py, então o pacote só resolve
      # com o diretório atual no sys.path. É a mesma invocação do CLAUDE.md.
      - name: Testes herméticos
        run: python -m pytest -m "not rede and not corpus"

      # Sai com código 1 se qualquer verificação executada reprovar. O
      # `resultados.json` gerado aqui não é commitado — vale o da máquina, que é
      # o único que roda as três camadas.
      - name: Evals — camada 1 (determinística)
        run: python evals/rodar.py --camada 1

      - name: Publicar o relatório dos evals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-evals
          path: |
            evals/relatorio.md
            evals/resultados.json
          if-no-files-found: warn
