[project]
name = "copiloto-normativo"
version = "0.1.0"
description = "Copiloto normativo BCB — RAG híbrido com citação verificada por código"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

# Toda dependência aqui é gratuita e roda em CPU (§3 do briefing).
# Nenhuma adição sem aprovação explícita.
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv", "data", "indices"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# `rede` usa a internet e carrega o modelo ONNX; o CI da Fase 7 desmarca com -m "not rede".
markers = ["rede: exige rede e o modelo de embeddings baixado localmente"]
