[project]
name = "copiloto-normativo"
version = "0.1.0"
description = "Copiloto normativo BCB — RAG híbrido com citação verificada por código"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

# Toda dependência aqui é gratuita e roda em CPU (§3 do briefing).
# Nenhuma adição sem aprovação explícita.
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "chromadb>=0.5",
    "fastembed>=0.8,<0.9",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    # Única dependência nova da Fase 9. `tracing.py` lê um campo de
    # `governanca.yaml` por regex para evitar isto; `ficha.py` carrega o
    # documento inteiro (modelos[], controles[]) num modelo Pydantic, e um
    # parser de linha não sustenta lista/objeto aninhado com segurança.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]
# Observabilidade (Fase 7). Extra, e não dependência principal, por dois motivos:
# o `langfuse` arrasta o OpenTelemetry inteiro, e a suíte hermética do CI não
# pode depender de pacote que só serve para falar com um serviço externo.
# `observabilidade/tracing.py` degrada para no-op quando o pacote não está
# instalado — o copiloto responde igual, só não emite trace.
obs = [
    "langfuse>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv", "data", "indices"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `crm_falso` é código deste repositório, ainda que fora do pacote `copiloto`: sem
# isto o isort o classifica como dependência de terceiro e embaralha os blocos.
known-first-party = ["copiloto", "crm_falso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
# `rede` usa a internet e carrega o modelo ONNX; o CI da Fase 7 desmarca com -m "not rede".
markers = [
    "rede: exige rede e o modelo de embeddings baixado localmente",
    "corpus: exige o corpus já coletado e indexado (python -m copiloto.ingestao.indexacao)",
]
